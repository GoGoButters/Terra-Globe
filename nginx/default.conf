server {
    listen 80;
    server_name _;

    # ── Gzip ──
    gzip on;
    gzip_types application/json text/css application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # ── Frontend static files ──
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — short cache with revalidation for development
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    # Images/fonts — longer cache (these don't change often)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML — no caching (always fresh)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── API proxy ──
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
